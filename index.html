<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ular Tangga Edukasi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
      :root {
        --f: "Courier New", ui-monospace, monospace;
        --dark: #16171d;
        --deep: #1f2128;
        --line: #3a3d4a;
        --light: #ece4cf;
        --mid: #d6ccb2;
        --red: #3a3d4a;
        --red-d: #3a3d4a;
        --gold: #ffb020;
        --gold-d: #a8680a;
        --warm: #f4efe2;
        --text: #16171d;
        --muted: #5b5a60;
        --ok: #ffb020;
        --ok-d: #a8680a;
        --bw: max(300px, min(92vw, calc(100vh - 150px), 680px));
      }
      * {
        box-sizing: border-box;
        border-radius: 0 !important;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--dark);
        color: var(--warm);
        font-family: var(--f);
        font-weight: 700;
        min-height: 100vh;
      }
      button,
      input,
      textarea,
      select {
        font-family: inherit;
      }
      .px {
        font-family: "Press Start 2P", monospace;
        line-height: 1.5;
        font-weight: 400;
      }
      .hidden {
        display: none !important;
      }
      .app {
        max-width: 1200px;
        margin: 0 auto;
        padding: 14px 16px 40px;
      }

      /* ---------- tombol ---------- */
      .btn {
        font-family: "Press Start 2P", monospace;
        font-size: 12px;
        line-height: 1.4;
        background: var(--gold);
        color: var(--text);
        border: 3px solid var(--text);
        padding: 12px 16px;
        cursor: pointer;
        box-shadow: 0 4px 0 var(--gold-d);
        transition:
          transform 0.06s,
          box-shadow 0.06s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-align: center;
      }
      .btn:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 5px 0 var(--gold-d);
      }
      .btn:active:not(:disabled) {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--gold-d);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.red {
        background: var(--red);
        color: #fff;
        box-shadow: 0 4px 0 #000;
      }
      .btn.red:hover:not(:disabled) {
        box-shadow: 0 5px 0 #000;
      }
      .btn.red:active:not(:disabled) {
        box-shadow: 0 1px 0 #000;
      }
      .btn.ghost {
        background: transparent;
        color: var(--warm);
        border-color: var(--mid);
        box-shadow: none;
      }
      .btn.sm {
        font-size: 9px;
        padding: 7px 9px;
        box-shadow: 0 3px 0 var(--gold-d);
      }
      .btn.sm.red {
        box-shadow: 0 3px 0 #000;
      }
      .btn.ghost.sm {
        box-shadow: none;
      }
      .btn.big {
        font-size: 14px;
        padding: 16px 18px;
        width: 100%;
      }
      .btn svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .box .btn.ghost {
        color: var(--text);
        border-color: var(--text);
      }
      :focus-visible {
        outline: 3px dashed var(--warm);
        outline-offset: 3px;
      }
      .box :focus-visible {
        outline-color: var(--text);
      }
      .file {
        cursor: pointer;
      }

      /* ---------- header ---------- */
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      .brand {
        color: var(--gold);
        font-size: 14px;
      }
      .top-actions {
        display: flex;
        gap: 8px;
      }

      /* ---------- stage ---------- */
      .stage {
        display: flex;
        gap: 28px;
        justify-content: center;
        align-items: flex-start;
      }
      .board-col {
        padding-bottom: calc(var(--bw) * 0.17);
      }
      .board-wrap {
        position: relative;
        width: var(--bw);
        height: var(--bw);
      }
      .board {
        display: grid;
        grid-template: repeat(var(--n, 8), 1fr) / repeat(var(--n, 8), 1fr);
        width: 100%;
        height: 100%;
        border: 4px solid var(--light);
        background: var(--light);
      }
      .cell {
        position: relative;
        background: var(--light);
        color: var(--text);
        font: 700 clamp(8px, 1.5vw, 13px) var(--f);
        padding: 3px 5px;
      }
      .cell.alt {
        background: var(--mid);
      }
      .cell.end {
        background: var(--gold);
      }
      .cell.end svg {
        position: absolute;
        right: 12%;
        bottom: 12%;
        width: 38%;
        height: auto;
      }
      .fx {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .startpad {
        position: absolute;
        left: 0;
        right: 0;
        top: 102%;
        height: 14%;
        border: 3px dashed var(--line);
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding-left: 10px;
      }
      .startpad span {
        font:
          400 clamp(6px, 1.1vw, 9px) "Press Start 2P",
          monospace;
        color: var(--mid);
      }
      .board-wrap.shake {
        animation: shakeb 0.45s;
      }
      @keyframes shakeb {
        0%,
        100% {
          transform: none;
        }
        20% {
          transform: translate(-6px, 2px);
        }
        40% {
          transform: translate(6px, -2px);
        }
        60% {
          transform: translate(-4px, 0);
        }
        80% {
          transform: translate(4px, 0);
        }
      }
      .pawn {
        position: absolute;
        width: 6.6%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        transition:
          left 0.2s steps(4),
          top 0.2s steps(4),
          width 0.2s;
        z-index: 3;
        pointer-events: none;
      }
      .pawn svg {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.4));
      }
      .pawn.now {
        z-index: 6;
      }
      .pawn.now svg {
        animation: bob 0.8s steps(2) infinite;
      }
      .pawn.hop svg {
        animation: hop 0.2s steps(3);
      }
      @keyframes bob {
        50% {
          transform: translateY(-14%);
        }
      }
      @keyframes hop {
        50% {
          transform: translateY(-40%);
        }
      }

      /* ---------- panel ---------- */
      .panel {
        width: 340px;
        flex: none;
        background: var(--deep);
        border: 3px solid var(--line);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .preview .panel {
        visibility: hidden;
      }
      .turn {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .turn .av {
        width: 48px;
        height: 48px;
        flex: none;
        background: #2a2c35;
        border: 3px solid var(--light);
        padding: 3px;
      }
      .turn .av svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .turn small {
        display: block;
        color: var(--mid);
        font-size: 13px;
        letter-spacing: 1px;
        margin-bottom: 4px;
      }
      .turn .name {
        font-size: 12px;
        color: var(--warm);
        word-break: break-word;
      }
      .turn.bump {
        animation: bump 0.4s;
      }
      @keyframes bump {
        0% {
          transform: scale(0.92);
        }
        60% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }
      .dice-area {
        display: flex;
        gap: 30px;
        justify-content: center;
        align-items: center;
        padding: 22px 0 18px;
        background: #191a20;
        border: 2px solid var(--line);
      }
      .scene {
        --d: 64px;
        width: var(--d);
        height: var(--d);
        perspective: 420px;
        position: relative;
        cursor: pointer;
      }
      .scene.toss {
        animation: toss 1.1s;
      }
      @keyframes toss {
        0% {
          transform: translateY(0);
        }
        35% {
          transform: translateY(-34px);
        }
        70% {
          transform: translateY(0);
        }
        82% {
          transform: translateY(-8px);
        }
        100% {
          transform: translateY(0);
        }
      }
      .cube {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 1.1s cubic-bezier(0.15, 0.75, 0.25, 1);
      }
      .face {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template: repeat(3, 1fr) / repeat(3, 1fr);
        padding: 6px;
        border: 3px solid var(--text);
        backface-visibility: hidden;
      }
      .face i {
        display: block;
        margin: 10%;
      }
      .face i.on {
        background: var(--text);
      }
      .face.f1 i.on {
        background: var(--gold-d);
      }
      .f1 {
        background: #f4efe2;
        transform: translateZ(calc(var(--d) / 2));
      }
      .f2 {
        background: #e6e0cf;
        transform: rotateY(90deg) translateZ(calc(var(--d) / 2));
      }
      .f3 {
        background: #faf6ea;
        transform: rotateX(90deg) translateZ(calc(var(--d) / 2));
      }
      .f4 {
        background: #d9d3c0;
        transform: rotateX(-90deg) translateZ(calc(var(--d) / 2));
      }
      .f5 {
        background: #e0dac8;
        transform: rotateY(-90deg) translateZ(calc(var(--d) / 2));
      }
      .f6 {
        background: #eee9d8;
        transform: rotateY(180deg) translateZ(calc(var(--d) / 2));
      }
      .dshadow {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: -20px;
        height: 8px;
        background: rgba(0, 0, 0, 0.35);
      }
      .log {
        min-height: 54px;
        font-size: 15px;
        line-height: 1.4;
        color: var(--warm);
        border-left: 4px solid var(--gold);
        padding: 4px 10px;
        background: #191a20;
      }
      .plist {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 340px;
        overflow: auto;
      }
      .prow {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 8px;
        border: 2px solid transparent;
        background: #191a20;
        font-size: 14px;
        color: var(--warm);
      }
      .prow.cur {
        border-color: var(--gold);
        background: #2a2c35;
      }
      .prow .av {
        width: 26px;
        height: 26px;
        flex: none;
      }
      .prow .av svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .prow .nm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .prow .pos {
        color: var(--mid);
        font-size: 13px;
      }
      .prow .st {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        color: var(--gold);
      }
      .prow .st svg {
        width: 14px;
        height: 14px;
      }

      /* ---------- popup ---------- */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(8, 8, 12, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        animation: fade 0.15s;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .box {
        background: var(--warm);
        color: var(--text);
        border: 4px solid var(--text);
        box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.5);
        width: min(100%, 680px);
        max-height: calc(100vh - 32px);
        display: flex;
        flex-direction: column;
        animation: pop 0.3s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      .box.sm {
        width: min(100%, 460px);
      }
      .box.lg {
        width: min(100%, 760px);
      }
      @keyframes pop {
        0% {
          transform: scale(0.6);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .box-h {
        flex: none;
        background: var(--gold);
        border-bottom: 4px solid var(--text);
        padding: 14px 20px;
        font:
          400 13px "Press Start 2P",
          monospace;
        line-height: 1.5;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .box-b {
        padding: 20px;
        overflow: auto;
        flex: 1;
      }
      .box-f {
        flex: none;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        flex-wrap: wrap;
        padding: 14px 20px;
        border-top: 3px solid var(--text);
        background: #e8e1cd;
      }
      .lead {
        font-size: 18px;
        line-height: 1.5;
        margin: 0;
      }
      .hint {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 12px;
        line-height: 1.5;
      }
      .in {
        width: 100%;
        background: #fff;
        color: var(--text);
        border: 3px solid var(--text);
        padding: 10px 12px;
        font: 700 16px var(--f);
      }
      .in:focus {
        outline: none;
        box-shadow: 0 0 0 3px var(--gold);
      }
      .mt {
        margin-top: 10px;
      }
      .add-row {
        display: flex;
        gap: 10px;
      }
      .add-row .btn {
        flex: none;
      }
      .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }
      .tools {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin: 14px 0 4px;
      }
      .tools .sep {
        font-size: 13px;
        color: var(--muted);
      }
      .more {
        margin-top: 12px;
      }
      .more summary {
        cursor: pointer;
        font-size: 14px;
        color: var(--muted);
        padding: 4px 0;
      }
      .more textarea {
        margin: 8px 0;
      }
      .list-h {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 16px 0 8px;
        font-size: 14px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        max-height: 300px;
        overflow: auto;
      }
      .scroll {
        max-height: 200px;
        overflow: auto;
        margin-top: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        background: #fff;
        border: 2px solid #cfc8b0;
        margin-bottom: 6px;
        font-size: 14px;
      }
      .grid2 .row {
        margin: 0;
      }
      .row .grow {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .av {
        width: 28px;
        height: 28px;
        flex: none;
      }
      .row .av svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .empty {
        color: var(--muted);
        font-size: 14px;
        margin: 6px 0;
      }
      .preview-box {
        margin-top: 12px;
        border: 3px solid var(--gold-d);
        padding: 10px;
        background: #fff4d6;
        font-size: 13px;
      }
      .preview-box table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 6px;
        font-size: 13px;
      }
      .preview-box td,
      .preview-box th {
        border: 1px solid #cfc8b0;
        padding: 4px 6px;
        text-align: left;
      }
      .steps {
        display: flex;
        gap: 6px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .steps li {
        display: flex;
        align-items: center;
        gap: 6px;
        opacity: 0.55;
        font-size: 10px;
      }
      .steps li b {
        display: inline-flex;
        width: 22px;
        height: 22px;
        align-items: center;
        justify-content: center;
        background: var(--warm);
        border: 3px solid var(--text);
        font-weight: 400;
      }
      .steps li.on {
        opacity: 1;
      }
      .steps li.on b,
      .steps li.done b {
        background: var(--text);
        color: var(--gold);
      }
      .steps li.done {
        opacity: 1;
      }
      @media (max-width: 620px) {
        .steps li span {
          display: none;
        }
      }
      .sec {
        margin-bottom: 18px;
      }
      .sec h3 {
        font:
          400 10px "Press Start 2P",
          monospace;
        margin: 0 0 10px;
        line-height: 1.6;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        font: 700 14px var(--f);
        background: #fff;
        color: var(--text);
        border: 3px solid var(--text);
        padding: 9px 14px;
        cursor: pointer;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
      }
      .chip.on {
        background: var(--text);
        color: var(--gold);
      }
      .levels .chip,
      .sizes .chip {
        flex: 1;
        min-width: 90px;
        text-align: center;
      }
      .stepper {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }
      .stepper .btn {
        font-size: 16px;
        padding: 6px 14px;
      }
      .stepper b {
        display: inline-block;
        min-width: 34px;
        text-align: center;
        font-size: 22px;
      }
      .setrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .setrow > span {
        font-size: 15px;
      }

      /* kartu misi */
      .m-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      .who-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        border: 3px solid var(--text);
        padding: 4px 10px 4px 4px;
        font-size: 15px;
      }
      .who-chip svg {
        width: 30px;
        height: 30px;
        display: block;
      }
      .m-q {
        font: 700 clamp(20px, 3vw, 30px) var(--f);
        line-height: 1.4;
        text-align: center;
        padding: 22px 6px;
        word-break: break-word;
      }
      .m-ans {
        margin-top: 4px;
        border: 3px solid var(--text);
        background: #fff4d6;
        padding: 12px;
        font-size: 20px;
        text-align: center;
        animation: pop 0.3s;
      }
      .tbar {
        height: 16px;
        background: #d9d2bb;
        border: 3px solid var(--text);
        margin-top: 4px;
      }
      .tbar i {
        display: block;
        height: 100%;
        width: 100%;
        background: var(--text);
      }
      .tbar.low i {
        background: var(--gold-d);
      }
      .tlab {
        font-size: 13px;
        text-align: right;
        color: var(--muted);
        margin-top: 4px;
      }
      .judge {
        display: flex;
        gap: 10px;
        flex: 1;
        justify-content: flex-end;
      }
      .judge .btn {
        flex: 1;
        max-width: 220px;
        font-size: 13px;
        padding: 14px;
      }

      /* home */
      .home {
        text-align: center;
        padding: 26px 22px 22px;
      }
      .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-bottom: 22px;
      }
      .logo svg {
        width: 56px;
        height: 56px;
      }
      .logo h1 {
        margin: 0;
        font-size: clamp(20px, 4vw, 28px);
        color: var(--text);
        line-height: 1.5;
      }
      .logo h1 em {
        font-style: normal;
        background: var(--gold);
        padding: 0 6px;
      }
      .home .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 340px;
        margin: 0 auto;
      }
      .linkbtn {
        background: none;
        border: none;
        color: var(--muted);
        font: 700 13px var(--f);
        cursor: pointer;
        padding: 6px;
      }

      /* hasil */
      .podium {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 10px;
        margin: 6px 0 18px;
      }
      .pod {
        width: 30%;
        max-width: 170px;
        text-align: center;
      }
      .pod .av {
        width: 48px;
        height: 48px;
        margin: 0 auto 4px;
      }
      .pod .av svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .pod .nm {
        font-size: 14px;
        word-break: break-word;
        margin-bottom: 6px;
      }
      .pod .blk {
        border: 4px solid var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          400 20px "Press Start 2P",
          monospace;
      }
      .pod.p1 .blk {
        height: 120px;
        background: var(--gold);
      }
      .pod.p2 .blk {
        height: 88px;
        background: #cfc8b0;
      }
      .pod.p3 .blk {
        height: 64px;

      .pod .stl {

      }
      .pod .stl svg {

      }
      .rank-list {
        max-height: 260px;
        overflow: auto;
      }
      .rank-list .row b {
        width: 24px;
        text-align: center;
      }
      .rank-list .st {
        display: inline-flex;
        gap: 3px;
        align-items: center;
      }
      .rank-list .st svg {
        width: 14px;
        height: 14px;
      }

      /* banner, toast, fx */
      #banners {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        pointer-events: none;
      }
      .banner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 22px 34px;
        border: 4px solid var(--text);
        box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.45);
        background: var(--warm);
        color: var(--text);
        text-align: center;
        max-width: 90vw;
        animation: pop 0.3s cubic-bezier(0.2, 1.4, 0.4, 1);
        transition:
          opacity 0.25s,
          transform 0.25s;
      }
      .banner.out {
        opacity: 0;
        transform: translateY(-16px);
      }
      .banner svg {
        width: 56px;
        height: 56px;
      }
      .banner .bemoji {
        font-size: 56px;
        line-height: 1;
      }
      .banner .bt {
        font-size: clamp(16px, 3vw, 24px);
      }
      .banner .bs {
        font-size: 16px;
      }
      .banner.ladder,
      .banner.win,
      .banner.good {
        background: var(--gold);
      }
      .banner.snake,
      .banner.bad {
        background: #3a3d4a;
        color: #fff;
      }
      #toast {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        background: var(--text);
        color: var(--warm);
        border: 3px solid var(--gold);
        padding: 10px 16px;
        font-size: 15px;
        max-width: 90vw;
        text-align: center;
        animation: pop 0.25s;
      }
      #fx-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 95;
        overflow: hidden;
      }

      @media (max-width: 900px) {
        .stage {
          flex-direction: column;
          align-items: center;
        }
        .panel {
          width: var(--bw);
        }
        .grid2 {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 480px) {
        .box-b {
          padding: 14px;
        }
        .box-h {
          padding: 12px 14px;
        }
        .box-f {
          padding: 12px 14px;
        }

          flex-direction: column;
        }
        .judge .btn {
          max-width: none;
        }

          --d: 56px;

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;

      /* popup lempar dadu */
      .rollpop .box-b {
        display: flex;
        flex-direction: column;

      .dice-stage {
        display: flex;

      }

      }
      .scene.idle {

      }
      @keyframes idle {
        50% {
          transform: translateY(-8px);

      .scene.settled {
        transform: scale(1.15);
        transition: transform 0.3s;

      .roll-res {
        min-height: 84px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;

      }

        }
