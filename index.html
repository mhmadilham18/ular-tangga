  </head>
  <body>
    <main id="view" class="app"></main>
    <div id="modals"></div>
    <div id="banners"></div>
    <div id="fx-layer"></div>
    <div id="toast" class="hidden" role="status" aria-live="polite"></div>

    <script>
      "use strict";
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (t) =>
        String(t).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
      const reduce =
        window.matchMedia &&
        matchMedia("(prefers-reduced-motion: reduce)").matches;

      const Pix = {
        svg(m, pal, cls = "") {
          let r = "";
          m.forEach((row, y) =>
            [...row].forEach((ch, x) => {
              const f = pal[ch];
              if (f)
                r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${f}"/>`;
            }),
          );
          return `<svg class="${cls}" viewBox="0 0 ${m[0].length} ${m.length}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
        },
        ICONS: {
          star: {
            m: [
              "....o....",
              "...oyo...",
              "...oyo...",
              "ooooyoooo",
              "oyyyyyyyo",
              ".oyyyyyo.",
              "..oyyyo..",
              ".oyyoyyo.",
              ".ooo.ooo.",
            ],
            pal: { o: "#16171d", y: "#ffb020" },
          },
          check: {
            m: [
              ".......c",
              "......cc",
              ".....cc.",
              "c...cc..",
              "cc.cc...",
              ".ccc....",
              "..c.....",
              "........",
            ],
            pal: { c: "currentColor" },
          },
          cross: {
            m: [
              "cc....cc",
              "ccc..ccc",
              ".cccccc.",
              "..cccc..",
              "..cccc..",
              ".cccccc.",
              "ccc..ccc",
              "cc....cc",
            ],
            pal: { c: "currentColor" },
          },
          ladder: {
            m: [
              "w......w",
              "wyyyyyyw",
              "w......w",
              "w......w",
              "wyyyyyyw",
              "w......w",
              "w......w",
              "wyyyyyyw",
            ],
            pal: { w: "#16171d", y: "#8a7a5c" },
          },
          snake: {
            m: [
              ".rrrrr..",
              "rrkrrrr.",
              "rr......",
              ".rrrr...",
              "...rrrr.",
              "......rr",
              "rr....rr",
              ".rrrrrr.",
            ],
            pal: { r: "#f4efe2", k: "#16171d" },
          },
          snakeRed: {
            m: [
              ".rrrrr..",
              "rrkrrrr.",
              "rr......",
              ".rrrr...",
              "...rrrr.",
              "......rr",
              "rr....rr",
              ".rrrrrr.",
            ],
            pal: { r: "#ffb020", k: "#16171d" },
          },
          flag: {
            m: [
              "wwww....",
              "wrrrrr..",
              "wrrrrrr.",
              "wrrrrr..",
              "w.......",
              "w.......",
              "w.......",
              "w.......",
            ],
            pal: { w: "#16171d", r: "#ffffff" },
          },
        },
        icon(n, cls = "") {
          const i = this.ICONS[n];
          return this.svg(i.m, i.pal, cls);
        },
      };

      const AVATARS = [
        [
          "..oooo..",
          ".obbbbo.",
          "obbbbbbo",
          "obkbbkbo",
          "obbbbbbo",
          "obbbbbbo",
          ".obbbbo.",
          "..o..o..",
        ],
        [
          "o......o",
          "obo..obo",
          "obbbbbbo",
          "obkbbkbo",
          "obbbbbbo",
          "obwbbwbo",
          ".obbbbo.",
          "..oooo..",
        ],
        [
          "...oo...",
          "...oo...",
          "oooooooo",
          "obbbbbbo",
          "obkbbkbo",
          "obbbbbbo",
          "obobbobo",
          "oooooooo",
        ],
        [
          "oo....oo",
          "obo..obo",
          "oobbbboo",
          "obbbbbbo",
          "obkbbkbo",
          "obbooobo",
          "obbbbbbo",
          ".oooooo.",
        ],
      ];
      const Sprite = {
        html(color, av = 0, cls = "") {
          return Pix.svg(
            AVATARS[av % AVATARS.length],
            { o: "#16171d", b: color, k: "#16171d", w: "#fffaf0" },
            cls,
          );
        },
      };

      const Fx = {
        COLORS: ["#ffb020", "#f4efe2", "#16171d", "#8a8fa3"],
        piece(x, y, dx, dy, rot, dur) {
          const el = document.createElement("i");
          const s = rnd(6, 11);
          el.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${this.COLORS[rnd(0, 3)]};border:2px solid #16171d`;
          $("#fx-layer").appendChild(el);
          el.animate(
            [
              { transform: "translate(0,0) rotate(0)", opacity: 1 },
              {
                transform: `translate(${dx}px,${dy}px) rotate(${rot}deg)`,
                opacity: 0,
              },
            ],
            {
              duration: dur,
              easing: "cubic-bezier(.2,.7,.4,1)",
              fill: "forwards",
            },
          ).onfinish = () => el.remove();
        },
        burst(x, y, n = 28) {
          if (reduce) return;
          for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2,
              v = 60 + Math.random() * 150;
            this.piece(
              x,
              y,
              Math.cos(a) * v,
              Math.sin(a) * v - 40 + 90,
              rnd(-360, 360),
              900 + Math.random() * 700,
            );
          }
        },
        rain(n = 70) {
          if (reduce) return;
          for (let i = 0; i < n; i++) {
            this.piece(
              Math.random() * innerWidth,
              -20,
              rnd(-80, 80),
              innerHeight + 40,
              rnd(-540, 540),
              1800 + Math.random() * 1600,
            );
          }
        },
        shake() {
          const el = $("#board-wrap");
          if (!el) return;
          el.classList.remove("shake");
          void el.offsetWidth;
          el.classList.add("shake");
        },
      };

      const Sound = {
        ctx: null,
        muted: (() => {
          try {
            return localStorage.getItem("ut-mute") === "1";
          } catch (e) {
            return false;
          }
        })(),
        unlock() {
          try {
            if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
          } catch (e) {}
        },
        tone(f, d = 0.1, when = 0, v = 0.05, type = "square") {
          if (this.muted) return;
          try {
            this.ctx =
              this.ctx ||
              new (window.AudioContext || window.webkitAudioContext)();
            const c = this.ctx,
              o = c.createOscillator(),
              g = c.createGain(),
              t = c.currentTime + when;
            o.type = type;
            o.frequency.value = f;
            g.gain.setValueAtTime(v, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + d);
            o.connect(g);
            g.connect(c.destination);
            o.start(t);
            o.stop(t + d);
          } catch (e) {}
        },
        seq(a) {
          let t = 0;
          a.forEach(([f, d]) => {
            this.tone(f, d, t);
            t += d;
          });
        },
        tick() {
          this.tone(300 + Math.random() * 300, 0.05);
        },
        thump() {
          this.tone(110, 0.14, 0, 0.12, "triangle");
        },
        step() {
          this.tone(520, 0.05);
        },
        pop() {
          this.seq([
            [440, 0.05],
            [660, 0.07],
          ]);
        },
        ladder() {
          this.seq([
            [392, 0.09],
            [494, 0.09],
            [587, 0.09],
            [784, 0.16],
          ]);
        },
        snake() {
          this.seq([
            [500, 0.1],
            [400, 0.1],
            [300, 0.1],
            [200, 0.22],
          ]);
        },
        card() {
          this.seq([
            [660, 0.08],
            [880, 0.12],
          ]);
        },
        good() {
          this.seq([
            [523, 0.08],
            [659, 0.08],
            [784, 0.14],
          ]);
        },
        bad() {
          this.seq([
            [300, 0.12],
            [220, 0.2],
          ]);
        },
        win() {
          this.seq([
            [523, 0.12],
            [659, 0.12],
            [784, 0.12],
            [1047, 0.38],
          ]);
        },
        toggle() {
          this.muted = !this.muted;
          try {
            localStorage.setItem("ut-mute", this.muted ? "1" : "0");
          } catch (e) {}
        },
        label() {
          return this.muted ? "SUARA: MATI" : "SUARA: NYALA";
        },
      };
      const syncMute = () =>
        document
          .querySelectorAll('[data-act="mute"]')
          .forEach((b) => (b.textContent = Sound.label()));

      const UI = {
        stack: [],
        push(html, o = {}) {
          const ov = document.createElement("div");
          ov.className = "overlay " + (o.cls || "");
          ov.setAttribute("role", "dialog");
          ov.setAttribute("aria-modal", "true");
          ov.dataset.dismiss = o.dismiss === false ? "0" : "1";
          ov.innerHTML = `<div class="box ${o.box || ""}">${html}</div>`;
          $("#modals").appendChild(ov);
          this.stack.push(ov);
          Sound.pop();
          const f = ov.querySelector("[data-focus]");
          if (f) f.focus({ preventScroll: true });
          return ov;
        },
        pop() {
          const ov = this.stack.pop();
          if (ov) ov.remove();
        },
        clear() {
          while (this.stack.length) this.pop();
        },
        top() {
          return this.stack[this.stack.length - 1];
        },
        confirm(msg, cb, yes = "YA") {
          const ov = this.push(
            `<div class="box-h"><span>KONFIRMASI</span></div>
       <div class="box-b"><p class="lead">${esc(msg)}</p></div>
       <div class="box-f"><button class="btn ghost" data-act="c-no" data-focus>BATAL</button><button class="btn red" data-act="c-yes">${esc(yes)}</button></div>`,
            { box: "sm" },
          );
          ov._cb = cb;
        },
        toast(t) {
          const el = $("#toast");
          el.textContent = t;
          el.classList.remove("hidden");
          el.style.animation = "none";
          void el.offsetWidth;
          el.style.animation = "";
          clearTimeout(this._t);
          this._t = setTimeout(() => el.classList.add("hidden"), 2600);
        },
        banner({
          title,
          sub = "",
          kind = "info",
          icon = "",
          emoji = "",
          ms = 1100,
        }) {
          return new Promise((res) => {
            const el = document.createElement("div");
            el.className = "banner " + kind;
            el.innerHTML = `${emoji ? `<div class="bemoji">${emoji}</div>` : icon ? Pix.icon(icon) : ""}<div class="px bt">${esc(title)}</div>${sub ? `<div class="bs">${esc(sub)}</div>` : ""}`;
            $("#banners").appendChild(el);
            setTimeout(() => el.classList.add("out"), Math.max(0, ms - 250));
            setTimeout(() => {
              el.remove();
              res();
            }, ms);
          });
        },
      };

      const Storage = {
        KEY: "ularTanggaSession",
        VER: 2,
        save(s) {
          try {
            localStorage.setItem(this.KEY, JSON.stringify(s));
          } catch (e) {
            console.warn("Gagal menyimpan", e);
          }
        },
        load() {
          try {
            const raw = localStorage.getItem(this.KEY);
            if (!raw) return null;
            const s = JSON.parse(raw);
            if (s.v !== this.VER || Date.now() >= s.expiresAt) {
              this.clear();
              return null;
            }
            return s;
          } catch (e) {
            return null;
          }
        },
        clear() {
          try {
            localStorage.removeItem(this.KEY);
          } catch (e) {}
        },
      };

      const Students = {
        MAX: 40,
        COLORS: [
          "#ff5d73",
          "#3b9cff",
          "#ffc933",
          "#a259ff",
          "#19d3b0",
          "#ff8a3d",
          "#ff5fb7",
          "#fffaf0",
          "#7ed957",
          "#b08968",
        ],
        /* 10 warna x 4 karakter = 40 kombinasi unik */
        av(s) {
          if (s.av != null) return s.av % AVATARS.length;
          const i = this.COLORS.indexOf(s.color);
          return i < 0 ? 0 : i % AVATARS.length;
        },
        add(list, name) {
          name = name.trim();
          if (!name) return "Nama tidak boleh kosong.";
          if (list.length >= this.MAX) return `Maksimal ${this.MAX} pemain.`;
          if (list.some((s) => s.name.toLowerCase() === name.toLowerCase()))
            return "Nama sudah ada: " + name;
          const used = new Set(list.map((s) => s.k));
          let k = 0;
          while (used.has(k)) k++;
          list.push({
            id:
              Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            name,
            color: this.COLORS[k % this.COLORS.length],
            av: Math.floor(k / this.COLORS.length) % AVATARS.length,
            k,
            pos: 0,
            stars: 0,
          });
          return null;
        },
        rename(list, id, name) {
          name = name.trim();
          if (!name) return "Nama tidak boleh kosong.";
          if (
            list.some(
              (s) => s.id !== id && s.name.toLowerCase() === name.toLowerCase(),
            )
          )
            return "Nama sudah ada.";
          list.find((s) => s.id === id).name = name;
          return null;
        },
        remove(list, id) {
          const i = list.findIndex((s) => s.id === id);
          if (i >= 0) list.splice(i, 1);
        },
      };

      const Missions = {
        add(list, misi, jawaban) {
          misi = misi.trim();
          if (!misi) return "Misi tidak boleh kosong.";
          list.push({ misi, jawaban: (jawaban || "").trim() });
          return null;
        },
        shuffle(a) {
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        },
        draw(S) {
          if (!S.cards.length) return null;
          const rep = !S.cfg || S.cfg.repeat !== false;
          if (!S.deck) S.deck = this.shuffle(S.cards.map((_, i) => i));
          if (!S.deck.length) {
            if (!rep) return null;
            S.deck = this.shuffle(S.cards.map((_, i) => i));
          }
          return S.deck.pop();
        },
        SAMPLES: {
          sd: [
            ["7 x 8 = ?", "56"],
            ["Planet terdekat dari Matahari?", "Merkurius"],
            ["Sebutkan 3 warna primer", "Merah, kuning, biru"],
            ["Air membeku pada suhu berapa derajat Celsius?", "0"],
            ["Segitiga punya berapa sisi?", "3"],
            [
              "Sebutkan 3 hewan yang hidup di laut",
              "Jawaban bebas, contoh: ikan, paus, kepiting",
            ],
          ],
          smp: [
            ["Hasil dari 15 x 12?", "180"],
            ["Rumus kimia air?", "H2O"],
            ["Kapan Proklamasi Kemerdekaan Indonesia?", "17 Agustus 1945"],
            ["Sebutkan 3 wujud zat", "Padat, cair, gas"],
            [
              "Gas apa yang diserap tumbuhan saat fotosintesis?",
              "Karbon dioksida (CO2)",
            ],
            ["Keliling lingkaran dengan r = 7 (pi = 22/7)?", "44"],
          ],
          sma: [
            ["Turunan dari f(x) = x kuadrat?", "2x"],
            ["Apa fungsi mitokondria?", "Menghasilkan energi (ATP)"],
            ["Berapa hasil log 100 (basis 10)?", "2"],
            ["Persamaan dasar akuntansi?", "Aset = Liabilitas + Ekuitas"],
            [
              "Apa itu inflasi?",
              "Kenaikan harga barang secara umum dan terus-menerus",
            ],
            ["Rumus kecepatan?", "v = s / t"],
          ],
        },
      };

      const Excel = {
        async read(file) {
          if (typeof XLSX === "undefined")
            throw new Error(
              "Library Excel belum dimuat (periksa koneksi internet).",
            );
          const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const raw = XLSX.utils.sheet_to_json(ws, { defval: "" });
          if (!raw.length) throw new Error("Sheet pertama kosong.");
          const rows = raw.map((r) => {
            const o = {};
            for (const k in r)
              o[String(k).trim().toLowerCase()] = String(r[k]).trim();
            return o;
          });
          if (!("misi" in rows[0]) || !("jawaban" in rows[0]))
            throw new Error(
              'Kolom wajib "misi" dan "jawaban" tidak ditemukan.',
            );
          const ok = [];
          let skipped = 0;
          rows.forEach((r) => {
            if (!r.misi) skipped++;
            else ok.push({ misi: r.misi, jawaban: r.jawaban || "" });
          });
          return { ok, skipped };
        },
        template() {
          if (typeof XLSX === "undefined")
            return UI.toast("Library Excel belum dimuat.");
          const ws = XLSX.utils.aoa_to_sheet([
            ["misi", "jawaban"],
            ["7 x 8 = ?", "56"],
            ["Sebutkan 3 warna primer", "Merah, kuning, biru"],
          ]);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Kartu");
          XLSX.writeFile(wb, "template-kartu-misi.xlsx");
        },
      };

      const Board = {
        N: 8,
        get total() {
          return this.N * this.N;
        },
        rc(n) {
          const i = n - 1,
            r = Math.floor(i / this.N),
            k = i % this.N;
          return { r, c: r % 2 === 0 ? k : this.N - 1 - k };
        },
        center(n) {
          const { r, c } = this.rc(n),
            w = 100 / this.N;
          return { x: (c + 0.5) * w, y: (this.N - 1 - r + 0.5) * w };
        },
        segX(p1, p2, p3, p4) {
          const o = (a, b, c) =>
            (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
          return (
            o(p3, p4, p1) * o(p3, p4, p2) < 0 &&
            o(p1, p2, p3) * o(p1, p2, p4) < 0
          );
        },
        pd(p, a, b) {
          const dx = b.x - a.x,
            dy = b.y - a.y,
            L2 = dx * dx + dy * dy || 1;
          const t = Math.max(
            0,
            Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2),
          );
          return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
        },
        generate(nSnake = 5, nLadder = 5) {
          const T = this.total,
            minD = this.N + 1,
            maxD = Math.round(T * 0.62),
            thr = (100 / this.N) * 0.88;
          for (let t = 0; t < 2500; t++) {
            const strict = t < 1800,
              used = new Set(),
              segs = [],
              snakes = [],
              ladders = [];
            let fail = false;
            const make = (isLadder) => {
              for (let k = 0; k < 60; k++) {
                const a = rnd(2, T - 1),
                  b = rnd(2, T - 1),
                  lo = Math.min(a, b),
                  hi = Math.max(a, b);
                if (
                  hi - lo < minD ||
                  hi - lo > maxD ||
                  used.has(lo) ||
                  used.has(hi)
                )
                  continue;
                if (this.rc(lo).r === this.rc(hi).r) continue;
                if (strict) {
                  const A = this.center(lo),
                    B = this.center(hi);
                  if (
                    segs.some((s) => {
                      const C = this.center(s[0]),
                        D = this.center(s[1]);
                      return (
                        this.segX(A, B, C, D) ||
                        Math.min(
                          this.pd(A, C, D),
                          this.pd(B, C, D),
                          this.pd(C, A, B),
                          this.pd(D, A, B),
                        ) < thr
                      );
                    })
                  )
                    continue;
                }
                used.add(lo);
                used.add(hi);
                segs.push([lo, hi]);
                return isLadder ? [lo, hi] : [hi, lo];
              }
              return null;
            };
            for (let i = 0; i < nLadder && !fail; i++) {
              const x = make(true);
              x ? ladders.push(x) : (fail = true);
            }
            for (let i = 0; i < nSnake && !fail; i++) {
              const x = make(false);
              x ? snakes.push(x) : (fail = true);
            }
            if (!fail && this.valid(snakes, ladders))
              return { snakes, ladders };
          }
          throw new Error("Gagal membuat papan");
        },
        valid(snakes, ladders) {
          const T = this.total,
            pts = [...snakes, ...ladders].flat();
          return (
            new Set(pts).size === pts.length &&
            pts.every((p) => p > 1 && p < T) &&
            snakes.every(([f, t]) => f > t) &&
            ladders.every(([f, t]) => f < t)
          );
        },
        jump(S, pos) {
          const l = S.ladders.find((x) => x[0] === pos);
          if (l) return { to: l[1], type: "ladder" };
          const s = S.snakes.find((x) => x[0] === pos);
          if (s) return { to: s[1], type: "snake" };
          return null;
        },
        cellsHTML() {
          const N = this.N,
            T = this.total;
          let h = "";
          for (let dr = 0; dr < N; dr++)
            for (let c = 0; c < N; c++) {
              const r = N - 1 - dr,
                n = r * N + (r % 2 === 0 ? c + 1 : N - c);
              h += `<div class="cell ${(r + c) % 2 ? "alt" : ""} ${n === T ? "end" : ""}">${n}${n === T ? Pix.icon("flag") : ""}</div>`;
            }
          return h;
        },

        /* --- gambar pixel: koordinat dikunci ke grid 2 satuan (viewBox 256), skala mengikuti ukuran papan --- */
        fxSVG(S) {
          const P = 2,
            snap = (v) => Math.round(v / P) * P,
            ev = (v) => Math.max(2, Math.round(v / 2) * 2),
            OL = "#16171d",
            sc = 8 / this.N;
          const U = (n) => {
            const c = this.center(n);
            return [c.x * 2.56, c.y * 2.56];
          };
          const clamp = (v) => Math.max(8, Math.min(248, v));
          const line = (ax, ay, bx, by) => {
            const n = Math.max(Math.abs(bx - ax), Math.abs(by - ay)) / P,
              pts = [];
            for (let i = 0; i <= n; i++) {
              const t = n ? i / n : 0;
              pts.push([snap(ax + (bx - ax) * t), snap(ay + (by - ay) * t)]);
            }
            return pts;
          };
          const mk = () => {
            const seen = new Set(),
              out = [],
              fill = [];
            const put = (arr, x, y, w, h, f) => {
              const key = `${arr === out ? "o" : "f"}${x},${y},${w},${h},${f}`;
              if (seen.has(key)) return;
              seen.add(key);
              arr.push(
                `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`,
              );
            };
            return { out, fill, put };
          };
          const box = (L, layer, cx, cy, size, color) => {
            const rx = snap(cx - size / 2),
              ry = snap(cy - size / 2);
            if (layer === "o")
              L.put(L.out, rx - P, ry - P, size + 2 * P, size + 2 * P, OL);
            else L.put(L.fill, rx, ry, size, size, color);
          };
          let g = "";

          S.ladders.forEach(([a, b]) => {
            const [ax, ay] = U(a),
              [bx, by] = U(b),
              dx = bx - ax,
              dy = by - ay,
              len = Math.hypot(dx, dy),
              ux = dx / len,
              uy = dy / len,
              nx = -uy,
              ny = ux,
              off = 7 * sc,
              rail = ev(4 * sc);
            const L = mk(),
              rails = [],
              rungs = [];
            [1, -1].forEach((s) =>
              line(
                ax + nx * off * s,
                ay + ny * off * s,
                bx + nx * off * s,
                by + ny * off * s,
              ).forEach(([x, y]) => rails.push([x, y])),
            );
            for (let d = 8 * sc; d < len - 6 * sc; d += 14 * sc) {
              const cx = ax + ux * d,
                cy = ay + uy * d;
              line(
                cx + nx * off,
                cy + ny * off,
                cx - nx * off,
                cy - ny * off,
              ).forEach(([x, y]) => rungs.push([x, y]));
            }
            rails.forEach(([x, y]) => box(L, "o", x, y, rail));
            rungs.forEach(([x, y]) => box(L, "o", x, y, 2));
            rungs.forEach(([x, y]) => box(L, "f", x, y, 2, "#e9dcb8"));
            rails.forEach(([x, y]) => box(L, "f", x, y, rail, "#8a7a5c"));
            g += L.out.join("") + L.fill.join("");
          });

          const PAL = [{ b: "#2c2f3d", s: "#ffb020" }];
          S.snakes.forEach(([a, b], si) => {
            const [ax, ay] = U(a),
              [bx, by] = U(b),
              dx = bx - ax,
              dy = by - ay,
              len = Math.hypot(dx, dy),
              nx = -dy / len,
              ny = dx / len;
            const waves = Math.max(2, Math.round(len / (52 * sc))),
              N = Math.ceil(len / 2),
              pal = PAL[si % PAL.length],
              L = mk(),
              pts = [];
            const big = ev(6 * sc),
              mid = ev(4 * sc);
            for (let i = 0; i <= N; i++) {
              const t = i / N,
                o =
                  Math.sin(t * Math.PI * 2 * waves) *
                  11 *
                  sc *
                  Math.sin(t * Math.PI);
              const x = clamp(snap(ax + dx * t + nx * o)),
                y = clamp(snap(ay + dy * t + ny * o));
              const last = pts[pts.length - 1];
              if (!last || last[0] !== x || last[1] !== y) pts.push([x, y]);
            }
            const sizeAt = (i) => {
              const t = i / (pts.length - 1);
              return t < 0.6 ? big : t < 0.88 ? mid : 2;
            };
            pts.forEach(([x, y], i) => box(L, "o", x, y, sizeAt(i)));
            pts.forEach(([x, y], i) =>
              box(
                L,
                "f",
                x,
                y,
                sizeAt(i),
                Math.floor(i / 4) % 3 === 2 ? pal.s : pal.b,
              ),
            );
            // kepala
            const hs = ev(12 * sc),
              hx = snap(ax - hs / 2),
              hy = snap(ay - hs / 2),
              tx = snap(hx + hs / 2 - 2);
            L.put(L.out, hx - P, hy - P, hs + 2 * P, hs + 2 * P, OL);
            L.put(L.out, tx - P, hy + hs, 4 + 2 * P, 4 + P, OL);
            L.put(L.fill, tx, hy + hs, 4, 4, "#f4efe2");
            L.put(L.fill, hx, hy, hs, hs, pal.b);
            const ey = snap(hy + hs * 0.3),
              e1 = snap(hx + hs * 0.2),
              e2 = snap(hx + hs * 0.6);
            L.put(L.fill, e1, ey, 2, 2, "#ffffff");
            L.put(L.fill, e2, ey, 2, 2, "#ffffff");
            L.put(L.fill, e1 + 1, ey + 1, 1, 1, OL);
            L.put(L.fill, e2 + 1, ey + 1, 1, 1, OL);
            L.put(
              L.fill,
              snap(hx + hs * 0.3),
              snap(hy + hs * 0.68),
              ev(hs * 0.4),
              2,
              pal.s,
            );
            g += L.out.join("") + L.fill.join("");
          });
          return `<svg class="fx" viewBox="0 0 256 256" shape-rendering="crispEdges" aria-hidden="true">${g}</svg>`;
        },
      };

      const Dice = {
        angs: {},
        PIPS: {
          1: [4],
          2: [0, 8],
          3: [0, 4, 8],
          4: [0, 2, 6, 8],
          5: [0, 2, 4, 6, 8],
          6: [0, 2, 3, 5, 6, 8],
        },
        TARGET: {
          1: [0, 0],
          2: [0, -90],
          3: [-90, 0],
          4: [90, 0],
          5: [0, 90],
          6: [0, -180],
        },
        face(v) {
          return `<div class="face f${v}">${Array.from({ length: 9 }, (_, i) => `<i class="${this.PIPS[v].includes(i) ? "on" : ""}"></i>`).join("")}</div>`;
        },
        tf(x, y) {
          return `rotateX(-24deg) rotateY(-30deg) rotateX(${x}deg) rotateY(${y}deg)`;
        },
        flat(x, y) {
          return `rotateX(0deg) rotateY(0deg) rotateX(${x}deg) rotateY(${y}deg)`;
        },
        html(n, pre = "", cls = "", act = "roll") {
          this.angs[pre] = Array.from({ length: n }, () => ({ x: 0, y: 0 }));
          return this.angs[pre]
            .map(
              (_, i) =>
                `<div class="scene ${cls}" id="${pre}sc${i}" data-act="${act}" title="Klik untuk melempar"><div class="cube" id="${pre}cube${i}" style="transform:${this.tf(0, 0)}">${[1, 2, 3, 4, 5, 6].map((v) => this.face(v)).join("")}</div><div class="dshadow"></div></div>`,
            )
            .join("");
        },
        nextAng(cur, t) {
          return Math.ceil((cur + 720 - t) / 360) * 360 + t;
        },
        show(vals, pre = "") {
          vals.forEach((v, i) => {
            const cube = $("#" + pre + "cube" + i);
            if (!cube) return;
            const [tx, ty] = this.TARGET[v];
            this.angs[pre][i] = { x: tx, y: ty };
            cube.style.transition = "none";
            cube.style.transform = this.tf(tx, ty);
          });
        },
        async roll(vals, pre = "") {
          const iv = setInterval(() => Sound.tick(), 110);
          vals.forEach((v, i) => {
            const cube = $("#" + pre + "cube" + i),
              sc = $("#" + pre + "sc" + i);
            if (!cube) return;
            const [tx, ty] = this.TARGET[v],
              a = this.angs[pre][i];
            a.x = this.nextAng(a.x + (i ? 180 : 0), tx);
            a.y = this.nextAng(a.y, ty);
            cube.style.transition = "";
            cube.style.transform = this.tf(a.x, a.y);
            sc.classList.remove("toss");
            void sc.offsetWidth;
            sc.classList.add("toss");
          });
          await sleep(reduce ? 50 : 1150);
          clearInterval(iv);
          Sound.thump();
        },
        /* luruskan dadu supaya sisi yang keluar menghadap penuh ke depan */
        async settle(vals, pre = "") {
          vals.forEach((v, i) => {
            const cube = $("#" + pre + "cube" + i),
              sc = $("#" + pre + "sc" + i);
            if (!cube) return;
            const a = this.angs[pre][i];
            cube.style.transition = "transform .45s ease-out";
            cube.style.transform = this.flat(a.x, a.y);
            sc.classList.add("settled");
          });
          await sleep(reduce ? 20 : 600);
        },
      };

      const Game = {
        S: null,
        busy: false,
        _tm: null,
        _lastTurn: null,
        cur() {
          return this.S.students[this.S.turn];
        },

        mountPreview() {
          const N = [6, 8, 10][rnd(0, 2)],
            c = { 6: [3, 3], 8: [5, 5], 10: [6, 6] }[N];
          Board.N = N;
          const b = Board.generate(c[0], c[1]);
          this.mount(
            {
              snakes: b.snakes,
              ladders: b.ladders,
              students: [],
              cards: [],
              cfg: { dice: 2, size: N },
              finishOrder: [],
              turn: 0,
              status: "preview",
            },
            true,
          );
        },

        mount(S, passive = false) {
          this.S = S;
          Board.N = (S.cfg && S.cfg.size) || 8;
          S.finishOrder = S.finishOrder || [];
          $("#view").classList.toggle("preview", S.status === "preview");
          $("#view").innerHTML = `
      <header class="top">
        <div class="brand px">ULAR TANGGA</div>
        <div class="top-actions">
          <button class="btn ghost sm" data-act="mute"></button>
          <button class="btn ghost sm" data-act="menu">MENU</button>
        </div>
      </header>
      <div class="stage">
        <div class="board-col">
          <div class="board-wrap" id="board-wrap">
            <div class="board" style="--n:${Board.N}">${Board.cellsHTML()}</div>${Board.fxSVG(S)}
            <div id="pawns">${S.students.map((s, i) => `<div class="pawn" data-i="${i}" title="${esc(s.name)}">${Sprite.html(s.color, Students.av(s))}</div>`).join("")}</div>
          </div>
        </div>
        <aside class="panel">
          <div class="turn" id="turn"></div>
          <div class="dice-area" id="dice-area">${Dice.html(S.cfg.dice || 1)}</div>
          <button class="btn big" id="btn-roll" data-act="roll">LEMPAR DADU</button>
          <div id="log" class="log" aria-live="polite"></div>
          <div id="plist" class="plist"></div>
        </aside>
      </div>`;
          if (S.dice && S.dice.length === (S.cfg.dice || 1)) Dice.show(S.dice);
          this._lastTurn = null;
          this.update();
          syncMute();
        },

        /* melanjutkan sesi tersimpan */
        resume() {
          const S = this.S;
          this.busy = false;
          if (S.status === "finished") return App.result();
          if (S.phase === "resolving") {
            S.phase = "roll";
            S.extra = false;
            this.advance();
            Storage.save(S);
          }
          this.log(`Giliran ${this.cur().name}. Siap melempar dadu!`);
          if (S.phase === "mission" && S.card != null) {
            this.busy = true;
            this.update();
            this.showMission(S.card);
          } else this.update();
        },

        /* posisi + ukuran pion; menyesuaikan jumlah pemain di satu kotak (sampai 40) */
        layout() {
          const S = this.S,
            N = Board.N,
            cell = 100 / N,
            base = cell * 0.56,
            g = {},
            out = [];
          S.students.forEach((s, i) => (g[s.pos] = g[s.pos] || []).push(i));
          for (const k in g) {
            const list = g[k],
              pos = +k,
              n = list.length;
            if (pos < 1) {
              const rows = n > 16 ? 2 : 1,
                per = Math.ceil(n / rows),
                sp = 80 / per,
                size = Math.min(base, sp * 1.15, rows === 1 ? 10 : 5.2);
              list.forEach((i, j) => {
                const r = Math.floor(j / per),
                  c = j % per;
                out[i] = {
                  x: 16 + sp * (c + 0.5),
                  y: rows === 1 ? 109 : 106.4 + r * 5.2,
                  s: size,
                };
              });
              continue;
            }
            const c = Board.center(pos);
            if (n === 1) {
              out[list[0]] = { x: c.x, y: c.y, s: base };
              continue;
            }
            const cols = Math.ceil(Math.sqrt(n)),
              rows = Math.ceil(n / cols),
              step = (cell * 0.92) / cols,
              size = Math.min(base, step * 1.1);
            list.forEach((i, j) => {
              out[i] = {
                x: c.x + ((j % cols) - (cols - 1) / 2) * step,
                y: c.y + (Math.floor(j / cols) - (rows - 1) / 2) * step,
                s: size,
              };
            });
          }
          return out;
        },

        place(idx = -1, opt = {}) {
          const S = this.S,
            pos = this.layout();
          const el0 =
            idx >= 0 ? document.querySelector(`.pawn[data-i="${idx}"]`) : null;
          if (el0 && opt.slide) {
            el0.style.transition = "left .9s steps(9), top .9s steps(9)";
            clearTimeout(el0._t);
            el0._t = setTimeout(() => (el0.style.transition = ""), 1000);
          }
          S.students.forEach((s, i) => {
            const el = document.querySelector(`.pawn[data-i="${i}"]`);
            if (!el) return;
            el.style.left = pos[i].x + "%";
            el.style.top = pos[i].y + "%";
            el.style.width = pos[i].s + "%";
            el.classList.toggle("now", i === S.turn && S.status === "playing");
          });
          if (el0 && !opt.slide) {
            el0.classList.remove("hop");
            void el0.offsetWidth;
            el0.classList.add("hop");
          }
        },

        pawnCenter(idx) {
          const el = document.querySelector(`.pawn[data-i="${idx}"]`);
          if (!el) return { x: innerWidth / 2, y: innerHeight / 2 };
          const r = el.getBoundingClientRect();
          return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        },

        update() {
          const S = this.S;
          if (!S || !S.students.length) return;
          const cur = this.cur(),
            playing = S.status === "playing";
          const turn = $("#turn");
          if (this._lastTurn !== S.turn) {
            turn.classList.remove("bump");
            void turn.offsetWidth;
            turn.classList.add("bump");
            this._lastTurn = S.turn;
          }
          $("#btn-roll").disabled = this.busy || !playing || S.phase !== "roll";
          $("#plist").innerHTML = S.students
            .map((s, i) => {
              const r = S.finishOrder.indexOf(s.id);
              return `<div class="prow ${i === S.turn && playing ? "cur" : ""}"><span class="av">${Sprite.html(s.color, Students.av(s))}</span><span class="nm">${esc(s.name)}</span><span class="st">${s.stars || 0}${Pix.icon("star")}</span><span class="pos">${r >= 0 ? "Juara " + (r + 1) : s.pos || "Start"}</span></div>`;
            })
            .join("");
          const rowCur = $("#plist .prow.cur");
          if (rowCur) rowCur.scrollIntoView({ block: "nearest" });
          this.place();
          syncMute();
        },

        log(t) {
          const l = $("#log");
          if (l) l.textContent = t;
        },

        /* ---------- alur giliran ---------- */
        /* langkah 1: popup giliran + dadu raksasa */
        roll() {
          const S = this.S;
          if (
            !S ||
            this.busy ||
            S.status !== "playing" ||
            S.phase !== "roll" ||
            UI.stack.length
          )
            return;
          this.busy = true;
          this.update();
          this.openRoll();
        },

        openRoll() {
          const S = this.S,
            p = this.cur(),
            n = S.cfg.dice || 1;
          this._rolled = null;
          this._rolling = false;
          UI.push(
            `
      <div class="box-h"><span>GILIRAN</span></div>
      <div class="box-b roll-b">
        <span class="who-chip">${Sprite.html(p.color, Students.av(p))}${esc(p.name)}</span>
        <div class="dice-stage" id="rstage">${Dice.html(n, "r", "big idle", "pop-roll")}</div>
        <div class="roll-res" id="rres">Klik dadu untuk melempar</div>
      </div>
      <div class="box-f" id="rfoot"><button class="btn big" data-act="pop-roll" data-focus>LEMPAR DADU</button></div>`,
            { dismiss: false, box: "sm", cls: "rollpop" },
          );
        },

        /* langkah 2: dadu dilempar, hasil ditampilkan jelas */
        async doRoll() {
          const S = this.S;
          if (
            !S ||
            this._rolling ||
            this._rolled ||
            S.phase !== "roll" ||
            !$("#rstage")
          )
            return;
          this._rolling = true;
          const n = S.cfg.dice || 1,
            vals = Array.from({ length: n }, () => rnd(1, 6));
          document
            .querySelectorAll("#rstage .scene")
            .forEach((e) => e.classList.remove("idle"));
          $("#rres").textContent = "Melempar...";
          const b = $("#rfoot button");
          b.disabled = true;
          await Dice.roll(vals, "r");
          await Dice.settle(vals, "r");
          const total = vals.reduce((a, c) => a + c, 0),
            dbl = n === 2 && vals[0] === vals[1];
          $("#rres").innerHTML =
            `<div class="px roll-num">${n > 1 ? vals.join(" + ") + " = " + total : total}</div><div class="roll-sub">Maju ${total} kotak</div>${dbl ? '<div class="roll-sub">DADU KEMBAR! Main lagi nanti</div>' : ""}`;
          dbl ? Sound.good() : Sound.pop();
          this._rolled = vals;
          this._rolling = false;
          b.disabled = false;
          b.dataset.act = "pop-go";
          b.textContent = "LANJUT JALAN";
          b.focus();
        },

        /* langkah 3: tutup popup, pion berjalan */
        async go() {
          const S = this.S,
            vals = this._rolled;
          if (!vals || S.phase !== "roll") return;
          this._rolled = null;
          UI.pop();
          S.dice = vals;
          Dice.show(vals);
          const n = vals.length,
            total = vals.reduce((a, b) => a + b, 0),
            idx = S.turn,
            p = S.students[idx];
          this.log(
            `${p.name} melempar ${vals.join(" + ")}${n > 1 ? " = " + total : ""}`,
          );
          if (n === 2 && vals[0] === vals[1]) S.extra = true;
          await this.walk(idx, total);
          await this.landed(idx);
          const f = await this.checkFinish(idx);
          if (f.over) return this.finish();
          if (f.won) return this.endTurn();
          const ci = Missions.draw(S);
          if (ci == null) {
            if (S.cards.length) this.log("Kartu misi sudah habis.");
            await sleep(500);
            return this.endTurn();
          }
          S.card = ci;
          S.phase = "mission";
          Storage.save(S);
          this.update();
          this.showMission(ci);
        },

        async walk(idx, steps) {
          const S = this.S,
            p = S.students[idx],
            T = Board.total;
          let dir = 1,
            bounced = false;
          for (let k = 0; k < steps; k++) {
            if (p.pos >= T) {
              dir = -1;
              bounced = true;
            }
            p.pos += dir;
            Sound.step();
            this.place(idx);
            await sleep(reduce ? 30 : 210);
          }
          if (bounced)
            await UI.banner({
              title: "PANTUL!",
              sub: `Harus pas di kotak ${T}`,
              kind: "info",
              ms: 1000,
            });
        },

        async landed(idx) {
          const S = this.S,
            p = S.students[idx];
          if (p.pos < Board.total) {
            const j = Board.jump(S, p.pos);
            if (j) {
              const up = j.type === "ladder";
              up ? Sound.ladder() : Sound.snake();
              const ban = UI.banner(
                up
                  ? {
                      title: "TANGGA!",
                      sub: `Naik ke kotak ${j.to}`,
                      kind: "ladder",
                      icon: "ladder",
                      ms: 1300,
                    }
                  : {
                      title: "ULAR!",
                      sub: `Turun ke kotak ${j.to}`,
                      kind: "snake",
                      icon: "snake",
                      ms: 1300,
                    },
              );
              await sleep(350);
              p.pos = j.to;
              this.place(idx, { slide: true });
              if (up) {
                const c = this.pawnCenter(idx);
                Fx.burst(c.x, c.y, 20);
              } else Fx.shake();
              await ban;
            }
          }
          S.moves = (S.moves || 0) + 1;
          p.t = S.moves;
          Storage.save(S);
        },

        async checkFinish(idx) {
          const S = this.S,
            p = S.students[idx];
          if (p.pos !== Board.total || S.finishOrder.includes(p.id))
            return { won: false, over: false };
          S.finishOrder.push(p.id);
          Sound.win();
          Fx.rain(70);
          const left = S.students.filter(
            (s) => !S.finishOrder.includes(s.id),
          ).length;
          await UI.banner({
            title: "FINISH!",
            sub: `${p.name} juara ${S.finishOrder.length}!`,
            kind: "win",
            icon: "star",
            ms: 1600,
          });
          return { won: true, over: S.cfg.mode !== "all" || left <= 1 };
        },

        showMission(ci) {
          const S = this.S,
            c = S.cards[ci],
            p = this.cur(),
            t = S.cfg.timer || 0;
          Sound.card();
          UI.push(
            `
      <div class="box-h"><span>KARTU MISI</span></div>
      <div class="box-b">
        <div class="m-head"><span class="who-chip">${Sprite.html(p.color, Students.av(p))}${esc(p.name)}</span></div>
        <div class="m-q">${esc(c.misi)}</div>
        ${t ? `<div class="tbar" id="tbar"><i></i></div><div class="tlab" id="tlab">${t} dtk</div>` : ""}
        <div id="ans" class="m-ans hidden">Jawaban: ${esc(c.jawaban || "(tidak ada jawaban)")}</div>
      </div>
      <div class="box-f">
        ${c.jawaban ? `<button class="btn ghost" data-act="show-ans" data-focus>LIHAT JAWABAN</button>` : ""}
        <div class="judge">
          <button class="btn red" data-act="judge" data-ok="0">${Pix.icon("cross")} SALAH</button>
          <button class="btn good" data-act="judge" data-ok="1" ${c.jawaban ? "" : "data-focus"}>${Pix.icon("check")} BENAR</button>
        </div>
      </div>`,
            { dismiss: false, box: "lg", cls: "mission" },
          );
          if (t) this.startTimer(t);
        },

        startTimer(sec) {
          this.stopTimer();
          const end = Date.now() + sec * 1000;
          this._tm = setInterval(() => {
            const bar = $("#tbar"),
              lab = $("#tlab");
            if (!bar) return this.stopTimer();
            const left = Math.max(0, (end - Date.now()) / 1000);
            bar.firstElementChild.style.width = (left / sec) * 100 + "%";
            lab.textContent = Math.ceil(left) + " dtk";
            if (left <= sec * 0.25) bar.classList.add("low");
            if (left <= 0) {
              this.stopTimer();
              lab.textContent = "WAKTU HABIS!";
              Sound.bad();
            }
          }, 100);
        },
        stopTimer() {
          clearInterval(this._tm);
          this._tm = null;
        },

        async judge(ok) {
          const S = this.S;
          if (S.phase !== "mission") return;
          const idx = S.turn,
            p = S.students[idx];
          this.stopTimer();
          UI.pop();
          S.phase = "resolving";
          if (ok) {
            p.stars = (p.stars || 0) + 1;
            Storage.save(S);
            this.update();
            Sound.good();
            const c = this.pawnCenter(idx);
            Fx.burst(c.x, c.y, 26);
            await UI.banner({
              title: "BENAR!",
              sub: S.cfg.bonus ? "+1 bintang dan maju 2 kotak" : "+1 bintang",
              kind: "good",
              emoji: "🏆",
              ms: 1200,
            });
            if (S.cfg.bonus) {
              await this.walk(idx, 2);
              await this.landed(idx);
              const f = await this.checkFinish(idx);
              if (f.over) return this.finish();
              if (f.won) return this.endTurn();
            }
          } else {
            Storage.save(S);
            Sound.bad();
            await UI.banner({
              title: "BELUM BENAR",
              sub: p.pos > 0 ? "Mundur 1 kotak" : "",
              kind: "bad",
              ms: 1100,
            });
            if (p.pos > 0) {
              p.pos -= 1;
              Sound.step();
              this.place(idx);
              await sleep(reduce ? 30 : 300);
              Storage.save(S);
            }
          }
          this.endTurn();
        },

        advance() {
          const S = this.S,
            n = S.students.length;
          let guard = 0;
          do {
            S.turn = (S.turn + 1) % n;
          } while (
            S.finishOrder.includes(S.students[S.turn].id) &&
            ++guard < n
          );
        },

        endTurn() {
          const S = this.S,
            p = this.cur();
          S.card = null;
          S.phase = "roll";
          const stay = S.extra && !S.finishOrder.includes(p.id);
          S.extra = false;
          if (!stay) this.advance();
          Storage.save(S);
          this.busy = false;
          this.update();
          this.log(
            stay
              ? `${p.name} dapat giliran lagi!`
              : `Giliran ${this.cur().name}. Ayo lempar dadu!`,
          );
        },

        ranking() {
          const S = this.S,
            fin = S.finishOrder.map((id) =>
              S.students.find((s) => s.id === id),
            );
          const rest = S.students
            .filter((s) => !S.finishOrder.includes(s.id))
            .sort(
              (a, b) =>
                b.pos - a.pos ||
                (b.stars || 0) - (a.stars || 0) ||
                (a.t || 0) - (b.t || 0),
            );
          const m = (s, finished) => ({
            name: s.name,
            color: s.color,
            av: Students.av(s),
            pos: s.pos,
            stars: s.stars || 0,
            finished,
          });
          return [
            ...fin.map((s) => m(s, true)),
            ...rest.map((s) => m(s, false)),
          ];
        },

        finish() {
          const S = this.S;
          S.status = "finished";
          S.phase = "done";
          S.ranking = this.ranking();
          S.winner = S.ranking[0].name;
          Storage.save(S);
          this.busy = false;
          this.update();
          App.result();
        },
      };

      const PRESETS = {
        sd: {
          dice: 1,
          size: 6,
          snakes: 3,
          ladders: 4,
          timer: 0,
          bonus: true,
          repeat: true,
          mode: "first",
        },
        smp: {
          dice: 2,
          size: 8,
          snakes: 5,
          ladders: 5,
          timer: 0,
          bonus: true,
          repeat: true,
          mode: "first",
        },
        sma: {
          dice: 2,
          size: 10,
          snakes: 7,
          ladders: 6,
          timer: 30,
          bonus: true,
          repeat: true,
          mode: "first",
        },
      };
      const LEVELS = [
        ["sd", "SD", "1 dadu, papan 6x6, santai"],
        ["smp", "SMP", "2 dadu, papan 8x8"],
        ["sma", "SMA", "2 dadu, papan 10x10, timer"],
      ];
      const SIZES = [
        [6, "6 x 6", "36 kotak, cepat"],
        [8, "8 x 8", "64 kotak, standar"],
        [10, "10 x 10", "100 kotak, seru panjang"],
      ];

      const App = {
        state: null,
        draft: null,
        pending: null,
        step: 1,
        _edit: null,

        newDraft(level = "smp") {
          return { students: [], cards: [], cfg: { ...PRESETS[level], level } };
        },

        clampCfg(cfg) {
          const mx = (cfg.size || 8) - 2;
          cfg.snakes = Math.min(cfg.snakes, mx);
          cfg.ladders = Math.min(cfg.ladders, mx);
        },

        init() {
          document.addEventListener("click", (e) => {
            Sound.unlock();
            const ov = e.target;
            if (
              ov.classList &&
              ov.classList.contains("overlay") &&
              ov.dataset.dismiss === "1"
            )
              return UI.pop();
            const b = e.target.closest("[data-act]");
            if (b && !b.disabled) this.act(b.dataset.act, b.dataset);
          });
          document.addEventListener("change", (e) => {
            if (e.target.id === "file-input")
              this.importFile(e.target.files[0]);
          });
          document.addEventListener("keydown", (e) => {
            const t = e.target,
              id = t.id;
            if (e.key === "Enter" && id === "in-name") {
              e.preventDefault();
              return this.act("add-student", {});
            }
            if (e.key === "Enter" && id === "in-misi") {
              e.preventDefault();
              return $("#in-jwb").focus();
            }
            if (e.key === "Enter" && id === "in-jwb") {
              e.preventDefault();
              return this.act("add-card", {});
            }
            if (e.key === "Enter" && (id === "ed-1" || id === "ed-2")) {
              e.preventDefault();
              return this.saveEdit();
            }
            if (e.key === "Escape") {
              const o = UI.top();
              if (o && o.dataset.dismiss === "1") UI.pop();
              return;
            }
            if (
              (e.key === " " || e.key === "Enter") &&
              !UI.stack.length &&
              !/INPUT|TEXTAREA|BUTTON|SELECT/.test(t.tagName)
            ) {
              const r = $("#btn-roll");
              if (r && !r.disabled) {
                e.preventDefault();
                Game.roll();
              }
            }
          });
          document.addEventListener("visibilitychange", () => {
            if (!document.hidden) this.checkExpiry();
          });
          window.addEventListener("focus", () => this.checkExpiry());
          this.draft = this.newDraft();
          this.home();
        },

        checkExpiry() {
          if (
            this.state &&
            this.state.expiresAt &&
            Date.now() >= this.state.expiresAt
          ) {
            Storage.clear();
            this.state = null;
            UI.toast("Sesi telah kedaluwarsa.");
            this.home();
          }
        },
        toast(t) {
          UI.toast(t);
        },
        confirm(m, cb, y) {
          UI.confirm(m, cb, y);
        },

        act(a, d) {
          const L = this.draft;
          switch (a) {
            /* beranda */
            case "new": {
              const go = () => {
                this.draft = this.newDraft();
                this.openWizard(1);
              };
              const s = Storage.load();
              return s && s.status === "playing"
                ? this.confirm(
                    "Permainan yang tersimpan akan diganti. Lanjut buat permainan baru?",
                    go,
                    "LANJUT",
                  )
                : go();
            }
            case "continue": {
              const s = Storage.load();
              if (!s) return this.home();
              this.state = s;
              UI.clear();
              Game.mount(s);
              return Game.resume();
            }
            case "last-result": {
              const s = Storage.load();
              if (!s) return this.home();
              this.state = s;
              UI.clear();
              Game.mount(s, true);
              return this.result();
            }
            case "reset":
              return this.confirm(
                "Hapus sesi tersimpan?",
                () => {
                  Storage.clear();
                  this.state = null;
                  this.home();
                },
                "HAPUS",
              );
            case "home":
              return this.home();
            case "c-yes": {
              const o = UI.top(),
                cb = o && o._cb;
              UI.pop();
              return cb && cb();
            }
            case "c-no":
            case "close":
              return UI.pop();
            case "mute":
              Sound.toggle();
              return syncMute();
            case "menu":
              return this.menu();

            /* wizard */
            case "wz-cancel":
              return this.home();
            case "wz-prev":
              this.step--;
              return this.renderWiz();
            case "wz-next":
              if (this.step === 1 && !L.students.length)
                return this.toast("Tambahkan minimal 1 pemain dulu.");
              this.step++;
              return this.renderWiz();
            case "add-student": {
              const i = $("#in-name"),
                er = Students.add(L.students, i.value);
              if (er) this.toast(er);
              else i.value = "";
              i.focus();
              return this.lists();
            }
            case "bulk": {
              const t = $("#in-bulk"),
                errs = [];
              t.value
                .split("\n")
                .filter((x) => x.trim())
                .forEach((n) => {
                  const er = Students.add(L.students, n);
                  if (er) errs.push(er);
                });
              t.value = "";
              if (errs.length) this.toast(errs[0]);
              return this.lists();
            }
            case "shuffle":
              Missions.shuffle(L.students);
              return this.lists();
            case "edit-student":
              return this.editModal("student", d.id);
            case "del-student":
              Students.remove(L.students, d.id);
              return this.lists();
            case "add-card": {
              const er = Missions.add(
                L.cards,
                $("#in-misi").value,
                $("#in-jwb").value,
              );
              if (er) this.toast(er);
              else {
                $("#in-misi").value = "";
                $("#in-jwb").value = "";
              }
              $("#in-misi").focus();
              return this.lists();
            }
            case "edit-card":
              return this.editModal("card", +d.i);
            case "del-card":
              L.cards.splice(+d.i, 1);
              return this.lists();
            case "prev-card":
              return this.editModal("view", +d.i);
            case "save-edit":
              return this.saveEdit();
            case "sample": {
              const have = new Set(L.cards.map((c) => c.misi));
              let n = 0;
              Missions.SAMPLES[d.lv].forEach(([m, j]) => {
                if (!have.has(m)) {
                  L.cards.push({ misi: m, jawaban: j });
                  n++;
                }
              });
              this.toast(n + " kartu contoh ditambahkan.");
              return this.lists();
            }
            case "template":
              return Excel.template();
            case "do-import": {
              const n = this.pending.ok.length;
              L.cards.push(...this.pending.ok);
              this.pending = null;
              this.toast(n + " kartu diimpor.");
              return this.lists();
            }
            case "cancel-import":
              this.pending = null;
              return this.lists();
            case "set-level":
              L.cfg = { ...PRESETS[d.lv], level: d.lv };
              return this.renderWiz();
            case "cfg-step":
              L.cfg[d.k] = Math.max(
                0,
                Math.min(L.cfg.size - 2, L.cfg[d.k] + +d.d),
              );
              return this.renderWiz();
            case "cfg-set": {
              const v =
                d.v === "true"
                  ? true
                  : d.v === "false"
                    ? false
                    : /^\d+$/.test(d.v)
                      ? +d.v
                      : d.v;
              L.cfg[d.k] = v;
              if (d.k === "size") this.clampCfg(L.cfg);
              return this.renderWiz();
            }
            case "create":
              return this.start();

            /* game */
            case "roll":
              return Game.roll();
            case "pop-roll":
              return Game.doRoll();
            case "pop-go":
              return Game.go();
            case "show-ans":
              $("#ans").classList.remove("hidden");
              Sound.pop();
              return;
            case "judge":
              return Game.judge(d.ok === "1");

            /* hasil */
            case "again": {
              const S = this.state;
              this.draft = {
                students: S.students.map((s) => ({
                  ...s,
                  pos: 0,
                  t: 0,
                  stars: 0,
                })),
                cards: S.cards.map((c) => ({ ...c })),
                cfg: { ...this.newDraft().cfg, ...S.cfg },
              };
              return this.start();
            }
            case "edit-setup": {
              const S = this.state;
              this.draft = {
                students: S.students.map((s) => ({
                  ...s,
                  pos: 0,
                  t: 0,
                  stars: 0,
                })),
                cards: S.cards.map((c) => ({ ...c })),
                cfg: { ...this.newDraft().cfg, ...S.cfg },
              };
              return this.openWizard(1);
            }
          }
        },

        /* ---------- beranda ---------- */
        home() {
          UI.clear();
          Game.stopTimer();
          Game.busy = false;
          const stored = Storage.load();
          const playing = stored && stored.status === "playing" ? stored : null;
          const last = stored && stored.status === "finished" ? stored : null;
          this.state = stored;
          playing ? Game.mount(playing, true) : Game.mountPreview();
          const curName = playing ? playing.students[playing.turn].name : "";
          UI.push(
            `
      <div class="home">
        <div class="logo">${Pix.icon("snakeRed")}<h1 class="px">ULAR<br><em>TANGGA</em></h1>${Pix.icon("ladder")}</div>
        <div class="stack">
          ${playing ? `<button class="btn" data-act="continue" data-focus>LANJUTKAN</button>` : ""}
          <button class="btn ${playing ? "ghost" : ""}" data-act="new" ${playing ? "" : "data-focus"}>MAIN BARU</button>
          ${last ? `<button class="btn ghost" data-act="last-result">HASIL TERAKHIR</button>` : ""}
          ${playing ? `<button class="linkbtn" data-act="reset">Hapus sesi tersimpan</button>` : ""}
        </div>
      </div>`,
            { dismiss: false, cls: "home-ov", box: "sm" },
          );
        },

        menu() {
          if (Game.busy) return this.toast("Tunggu giliran selesai dulu.");
          UI.push(
            `
      <div class="box-h"><span>MENU</span></div>
      <div class="box-b" style="display:flex;flex-direction:column;gap:12px">
        <button class="btn" data-act="close" data-focus>LANJUT MAIN</button>
        <button class="btn ghost" data-act="mute">${Sound.label()}</button>
        <button class="btn ghost" data-act="home">BERANDA</button>
      </div>`,
            { box: "sm" },
          );
        },

        /* ---------- wizard ---------- */
        openWizard(step = 1) {
          this.step = step;
          this.pending = null;
          UI.clear();
          UI.push(
            `<div class="box-h" id="wz-head"></div><div class="box-b" id="wz-body"></div><div class="box-f" id="wz-foot"></div>`,
            { dismiss: false, box: "lg", cls: "wiz" },
          );
          this.renderWiz();
        },

        renderWiz() {
          if (!$("#wz-body")) return;
          const st = this.step,
            names = ["PEMAIN", "MISI", "ATURAN"];
          $("#wz-head").innerHTML =
            `<span>BUAT PERMAINAN</span><ol class="steps">${names.map((n, i) => `<li class="${i + 1 === st ? "on" : i + 1 < st ? "done" : ""}"><b>${i + 1}</b><span>${n}</span></li>`).join("")}</ol>`;
          $("#wz-body").innerHTML = this["step" + st]();
          $("#wz-foot").innerHTML =
            (st === 1
              ? `<button class="btn ghost" data-act="wz-cancel">BATAL</button>`
              : `<button class="btn ghost" data-act="wz-prev">&lt; KEMBALI</button>`) +
            (st < 3
              ? `<button class="btn" data-act="wz-next">LANJUT &gt;</button>`
              : `<button class="btn good" data-act="create">MULAI MAIN!</button>`);
          this.lists();
          if (st === 1) $("#in-name").focus();
          if (st === 2) $("#in-misi").focus();
        },

        step1() {
          return `<div class="add-row"><input id="in-name" class="in" placeholder="Nama pemain" maxlength="24" autocomplete="off"><button class="btn" data-act="add-student">TAMBAH</button></div>
      <details class="more"><summary>Tempel banyak nama sekaligus</summary><textarea id="in-bulk" class="in" rows="4" placeholder="Satu nama per baris"></textarea><button class="btn sm" data-act="bulk">TAMBAH SEMUA</button></details>
      <div class="list-h"><span id="cnt-s"></span><button class="btn ghost sm" data-act="shuffle">ACAK URUTAN</button></div>
      <div id="student-list" class="grid2"></div>`;
        },

        step2() {
          return `<input id="in-misi" class="in" placeholder="Tulis misi atau pertanyaan" maxlength="220" autocomplete="off">
      <input id="in-jwb" class="in mt" placeholder="Jawaban" maxlength="160" autocomplete="off">
      <div class="btn-row"><button class="btn" data-act="add-card">TAMBAH KARTU</button></div>
      <div class="tools">
        <label class="btn ghost sm file">IMPOR EXCEL<input id="file-input" type="file" accept=".xlsx,.xls" hidden></label>
        <button class="btn ghost sm" data-act="template">UNDUH TEMPLATE</button>
        <button class="btn ghost sm" data-act="sample" data-lv="sd">SD</button>
        <button class="btn ghost sm" data-act="sample" data-lv="smp">SMP</button>
        <button class="btn ghost sm" data-act="sample" data-lv="sma">SMA</button>
      </div>
      <div id="import-preview"></div>
      <div class="list-h"><span id="cnt-c"></span></div>
      <div id="card-list" class="scroll"></div>`;
        },

        step3() {
          const g = this.draft.cfg,
            mx = g.size - 2;
          const chip = (k, v, label, extra = "") =>
            `<button class="chip ${g[k] === v ? "on" : ""}" data-act="cfg-set" data-k="${k}" data-v="${v}">${label}${extra}</button>`;
          const stp = (k, label) =>
            `<div class="setrow"><span>${label}</span><div class="stepper"><button class="btn sm" data-act="cfg-step" data-k="${k}" data-d="-1" aria-label="Kurangi">-</button><b>${g[k]}</b><button class="btn sm" data-act="cfg-step" data-k="${k}" data-d="1" aria-label="Tambah">+</button></div></div>`;
          return `<div class="sec"><h3>JENJANG</h3><div class="chips levels">${LEVELS.map(([k, n, s]) => `<button class="chip ${g.level === k ? "on" : ""}" data-act="set-level" data-lv="${k}">${n}</button>`).join("")}</div></div>
      <div class="sec"><h3>UKURAN PAPAN</h3><div class="chips sizes">${SIZES.map(([v, n, s]) => `<button class="chip ${g.size === v ? "on" : ""}" data-act="cfg-set" data-k="size" data-v="${v}">${n}</button>`).join("")}</div></div>
      <div class="sec"><h3>DADU</h3><div class="chips">${chip("dice", 1, "1 DADU")}${chip("dice", 2, "2 DADU")}</div></div>
      <div class="sec"><h3>ULAR &amp; TANGGA</h3>${stp("snakes", "Jumlah ular")}${stp("ladders", "Jumlah tangga")}</div>
      <div class="sec"><h3>WAKTU MENJAWAB</h3><div class="chips">${chip("timer", 0, "TANPA")}${chip("timer", 15, "15 DTK")}${chip("timer", 30, "30 DTK")}${chip("timer", 60, "60 DTK")}</div></div>
      <div class="sec"><h3>ATURAN</h3><div class="chips">
        ${chip("bonus", true, "JIKA BENAR  +1 BINTANG &amp; MAJU 2 LANGKAH", "")}${chip("bonus", false, "JIKA BENAR  +1 BINTANG")}</div>
        <div class="chips mt">${chip("repeat", true, "KARTU DIULANG")}${chip("repeat", false, "KARTU SEKALI PAKAI")}</div>
        <div class="chips mt">${chip("mode", "first", "SELESAI SAAT ADA PEMENANG")}${chip("mode", "all", "LANJUT SAMPAI SEMUA SELESAI")}</div></div>`;
        },

        lists() {
          const L = this.draft,
            sl = $("#student-list");
          if (sl) {
            sl.innerHTML =
              L.students
                .map(
                  (s) =>
                    `<div class="row"><span class="av">${Sprite.html(s.color, Students.av(s))}</span><span class="grow">${esc(s.name)}</span><button class="btn sm" data-act="edit-student" data-id="${s.id}">EDIT</button><button class="btn sm red" data-act="del-student" data-id="${s.id}" aria-label="Hapus ${esc(s.name)}">X</button></div>`,
                )
                .join("") || '<p class="empty">Belum ada pemain.</p>';
            $("#cnt-s").textContent =
              `${L.students.length} / ${Students.MAX} pemain`;
          }
          const cl = $("#card-list");
          if (cl) {
            cl.innerHTML =
              L.cards
                .map(
                  (c, i) =>
                    `<div class="row"><span class="grow">${esc(c.misi)}</span><button class="btn sm ghost" data-act="prev-card" data-i="${i}">LIHAT</button><button class="btn sm" data-act="edit-card" data-i="${i}">EDIT</button><button class="btn sm red" data-act="del-card" data-i="${i}" aria-label="Hapus kartu">X</button></div>`,
                )
                .join("") || '<p class="empty">Belum ada kartu.</p>';
            $("#cnt-c").textContent = `${L.cards.length} kartu`;
          }
          const pv = $("#import-preview"),
            p = this.pending;
          if (pv)
            pv.innerHTML = p
              ? `<div class="preview-box"><b>Preview:</b> ${p.ok.length} baris valid, ${p.skipped} dilewati.
      <table><tr><th>Misi</th><th>Jawaban</th></tr>${p.ok
        .slice(0, 5)
        .map(
          (r) => `<tr><td>${esc(r.misi)}</td><td>${esc(r.jawaban)}</td></tr>`,
        )
        .join("")}</table>
      <div class="btn-row"><button class="btn sm" data-act="do-import">TAMBAHKAN ${p.ok.length} KARTU</button><button class="btn sm ghost" data-act="cancel-import">BATAL</button></div></div>`
              : "";
        },

        async importFile(f) {
          if (!f) return;
          try {
            this.pending = await Excel.read(f);
          } catch (e) {
            this.pending = null;
            this.toast(e.message);
          }
          const inp = $("#file-input");
          if (inp) inp.value = "";
          this.lists();
        },

        editModal(type, key) {
          const L = this.draft;
          this._edit = { type, key };
          let body,
            btn = '<button class="btn" data-act="save-edit">SIMPAN</button>',
            title = "EDIT";
          if (type === "student")
            body = `<label>Nama pemain</label><input id="ed-1" class="in mt" maxlength="24" value="${esc(L.students.find((x) => x.id === key).name)}" data-focus>`;
          else if (type === "card") {
            const c = L.cards[key];
            body = `<label>Misi</label><input id="ed-1" class="in mt" maxlength="220" value="${esc(c.misi)}" data-focus><label style="display:block;margin-top:12px">Jawaban</label><input id="ed-2" class="in mt" maxlength="160" value="${esc(c.jawaban)}">`;
          } else {
            const c = L.cards[key];
            title = "PRATINJAU KARTU";
            btn = "";
            body = `<div class="m-q">${esc(c.misi)}</div><div class="m-ans">Jawaban: ${esc(c.jawaban || "-")}</div>`;
          }
          UI.push(
            `<div class="box-h"><span>${title}</span></div><div class="box-b">${body}</div><div class="box-f"><button class="btn ghost" data-act="c-no">${type === "view" ? "TUTUP" : "BATAL"}</button>${btn}</div>`,
            { box: "sm" },
          );
        },

        saveEdit() {
          const L = this.draft,
            { type, key } = this._edit;
          if (!$("#ed-1")) return;
          let er;
          if (type === "student")
            er = Students.rename(L.students, key, $("#ed-1").value);
          else {
            const m = $("#ed-1").value.trim();
            if (!m) er = "Misi tidak boleh kosong.";
            else {
              L.cards[key].misi = m;
              L.cards[key].jawaban = $("#ed-2").value.trim();
            }
          }
          if (er) return this.toast(er);
          UI.pop();
          this.lists();
        },

        /* ---------- mulai permainan ---------- */
        start() {
          const L = this.draft;
          if (!L.students.length) {
            this.step = 1;
            this.renderWiz();
            return this.toast("Tambahkan minimal 1 pemain.");
          }
          L.cfg.size = L.cfg.size || 8;
          this.clampCfg(L.cfg);
          Board.N = L.cfg.size;
          let b;
          try {
            b = Board.generate(L.cfg.snakes, L.cfg.ladders);
          } catch (e) {
            return this.toast(
              "Gagal membuat papan, kurangi jumlah ular/tangga.",
            );
          }
          const now = Date.now();
          const S = {
            v: Storage.VER,
            id: "g" + now.toString(36),
            createdAt: now,
            expiresAt: now + 24 * 3600 * 1000,
            students: L.students.map((s) => ({ ...s, pos: 0, stars: 0, t: 0 })),
            cards: L.cards.map((c) => ({ ...c })),
            snakes: b.snakes,
            ladders: b.ladders,
            deck: null,
            cfg: { ...L.cfg },
            finishOrder: [],
            moves: 0,
            turn: 0,
            dice: null,
            phase: "roll",
            extra: false,
            card: null,
            status: "playing",
            winner: null,
            ranking: [],
          };
          this.state = S;
          Storage.save(S);
          UI.clear();
          Game.busy = false;
          Game.mount(S);
          Game.log(`Ayo mulai! ${S.students[0].name} jalan duluan.`);
          Sound.good();
        },

        /* ---------- hasil ---------- */
        result() {
          const S = this.state,
            R = S.ranking && S.ranking.length ? S.ranking : Game.ranking();
          const st = (n) => `${n}${Pix.icon("star")}`;
          const pod = (r, k) =>
            r
              ? `<div class="pod p${k}"><div class="av">${Sprite.html(r.color, Students.av(r))}</div><div class="nm">${esc(r.name)}</div><div class="stl">${st(r.stars)}</div><div class="blk">${k}</div></div>`
              : "";
          const order =
            R.length > 1
              ? [pod(R[1], 2), pod(R[0], 1), pod(R[2], 3)]
              : [pod(R[0], 1)];
          UI.clear();
          UI.push(
            `
      <div class="box-h"><span>PEMENANG!</span></div>
      <div class="box-b">
        <div class="podium">${order.join("")}</div>
        <div class="rank-list">${R.map((r, i) => `<div class="row"><b>${i + 1}</b><span class="av">${Sprite.html(r.color, Students.av(r))}</span><span class="grow">${esc(r.name)}</span><span class="st">${st(r.stars)}</span><span>${r.finished ? "Finish" : "Kotak " + r.pos}</span></div>`).join("")}</div>
      </div>
      <div class="box-f"><button class="btn ghost" data-act="home">BERANDA</button><button class="btn ghost" data-act="edit-setup">UBAH ATURAN</button><button class="btn good" data-act="again" data-focus>MAIN LAGI</button></div>`,
            { dismiss: false, box: "lg", cls: "result" },
          );
          Fx.rain(60);
        },
      };

      App.init();
    </script>
  </body>
</html>
